services:
  mysql:
    image: mysql:8.4
    container_name: cancha-profe-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: la_cancha_del_profe
      MYSQL_USER: padel
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definí MYSQL_PASSWORD en .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definí MYSQL_ROOT_PASSWORD en .env}
      TZ: America/Argentina/Buenos_Aires
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h localhost -uroot -p"${MYSQL_ROOT_PASSWORD}"']
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  mysql_data:
